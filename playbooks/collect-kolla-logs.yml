---
# Upload /var/log/kolla and the container health state from every testbed
# host with the job's logs, so a failure inside an OpenStack service can be
# traced to that service's own log instead of only to the symptom the deploy
# or tempest step reports.
#
# kolla services log to files under /var/log/kolla, not to the container's
# stdout, so nothing in the job output carries them. The directory is copied
# whole, rotated files included, which keeps the next failing service covered
# without having to name it here first.
#
# Every file is gzipped on its own, keeping its name with ".gz" appended:
# nova-compute.log becomes kolla/<host>/nova/nova-compute.log.gz. A tempest
# run at DEBUG writes tens of MB per service log, and gzip shrinks them 8-25x;
# single-file gzip, unlike one archive, stays readable with zless/zgrep.
#
# The container health state is taken first, as close to the failure as
# post-run gets: docker keeps only the last five probe results per container,
# so a container that recovers loses the failing ones within a few probes.
# It is written per host as container-health/<host>.json, a JSON array with
# one entry per container, and the unhealthy ones are also printed into the
# job output.
#
# The manager's validator reports are copied as well, to validator-reports/.
# "osism validate" names only the report file when a check fails; the
# per-host data that says why (which OSD IDs, which mons) is in the report
# and nowhere in the job output.
#
# The manager's own services (mariadb, ara-server, the *-ansible containers,
# the inventory reconciler, ...) are not kolla services: they log to the
# container's stdout, which neither /var/log/kolla nor the health record
# carries. "docker logs" of every container on the manager is copied to
# manager-containers/<container>.log.gz. manager.service stops its containers
# rather than removing them, so a log spans every restart since the
# container was created.
#
# Only failed builds are collected. A green build needs none of this, and
# skipping it keeps the log server's volume to the builds someone will read.
#
# This runs in post-run, before the cleanup play tears the environment down.
# The orchestrator can only reach the manager directly (the nodes sit on a
# private network), so every host is read through the manager. The play is
# best-effort and must never fail the job.
#
# Each ssh gets "-n": "osism" on the manager is a wrapper around
# "docker exec -i", which drains whatever stdin it inherits. Fed a script on
# stdin, it swallows the rest of that script without an error.
- name: Collect kolla logs play
  hosts: all

  vars_files:
    - vars/mappings.yml
    - vars/repositories.yml

  vars:
    basepath: "{{ ansible_user_dir }}/src/{{ repositories['testbed']['path'] }}"
    terraform_path: "{{ basepath }}/terraform"
    kolla_logs_dir: "{{ ansible_user_dir }}/zuul-output/logs/kolla"
    container_health_dir: "{{ ansible_user_dir }}/zuul-output/logs/container-health"
    validator_reports_dir: "{{ ansible_user_dir }}/zuul-output/logs/validator-reports"
    manager_containers_dir: "{{ ansible_user_dir }}/zuul-output/logs/manager-containers"
    # INI inventory the testbed writes on the manager; used to name the hosts
    # when "osism get hosts" cannot.
    manager_inventory: /opt/configuration/inventory/10-custom
    # The host list is passed between tasks in this file, not in a task's
    # stdout: Zuul's command module merges stderr into stdout, so stdout
    # also carries notices and ssh errors.
    kolla_hosts_file: "{{ ansible_user_dir }}/kolla-hosts.txt"
    kolla_hosts: "{{ (_kolla_hosts_list.content | default('') | b64decode).splitlines() | select | list }}"
    # Runs ssh to the manager with the remaining arguments as the command.
    manager_ssh: >-
      ssh -n
      -i {{ terraform_path }}/.id_rsa.{{ cloud }}
      -o BatchMode=yes
      -o ConnectTimeout=10
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o LogLevel=ERROR
      dragon@{{ manager_host }}
    manager_host: "{{ _kolla_manager_address.content | b64decode | trim | split('=') | last | replace('\"', '') }}"

  tasks:
    # The orchestrator is a static node, and each build slot is a user
    # whose home outlives the build: nothing empties zuul-output between
    # builds. Without this, every build, green ones included, would upload
    # whatever earlier builds in the slot collected. This play runs before
    # the base job fetches zuul-output, so it runs for every build, before
    # the zuul_success gate. Outside Zuul it deletes nothing.
    - name: Remove what earlier builds left behind
      when: zuul is defined
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ kolla_logs_dir }}"
        - "{{ container_health_dir }}"
        - "{{ validator_reports_dir }}"
        - "{{ manager_containers_dir }}"
        - "{{ kolla_hosts_file }}"

    - name: Set cloud fact (Zuul deployment)
      ansible.builtin.set_fact:
        cloud: "{{ cloud_envs[hostvars[groups['all'][0]]['nodepool']['label']] }}"
      when: "'nodepool' in hostvars[groups['all'][0]]"

    - name: Set cloud fact (local deployment)
      ansible.builtin.set_fact:
        cloud: "{{ testbed_cloud | default('ci') }}"
      when: "'nodepool' not in hostvars[groups['all'][0]]"

    # Every task below depends on the manager address, so skipping this
    # one skips the play. Outside Zuul zuul_success is unset, and a
    # local deployment is still up to be inspected directly.
    - name: Read the manager address
      when: not (zuul_success | default(true) | bool)
      ansible.builtin.slurp:
        src: "{{ terraform_path }}/.MANAGER_ADDRESS.{{ cloud }}"
      register: _kolla_manager_address
      failed_when: false

    - name: Find the testbed hosts
      when: _kolla_manager_address.content is defined
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          hosts=$({{ manager_ssh }} 'osism get hosts </dev/null 2>/dev/null' | awk -F'|' '/^\|/ {gsub(/^ +| +$/,"",$2); if ($2!="" && $2!="Host" && $2!~/^-+$/) print $2}')
          if [ -z "${hosts}" ]; then
            echo "'osism get hosts' yielded no hosts, falling back to {{ manager_inventory }}"
            hosts=$({{ manager_ssh }} "awk '/^\[/ {skip = (\$0 ~ /:(children|vars)\]/); next} /^[[:space:]]*[#;]/ {next} /^[[:space:]]*\$/ {next} !skip {print \$1}' {{ manager_inventory }}" | sort -u)
          fi
          printf '%s\n' "${hosts}" > "{{ kolla_hosts_file }}"
      args:
        executable: /bin/bash
      register: _kolla_hosts
      changed_when: false
      failed_when: false

    - name: Read the host list
      when: _kolla_manager_address.content is defined
      ansible.builtin.slurp:
        src: "{{ kolla_hosts_file }}"
      register: _kolla_hosts_list
      failed_when: false

    - name: Record the container health state of all testbed hosts
      when: kolla_hosts | length > 0
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          # Keep name, state and the health record (status, failing streak,
          # last five probes with their output) of every container.
          reduce='
          import json, sys
          host, out = sys.argv[1:]
          try:
              containers = json.load(sys.stdin)
          except ValueError:
              containers = []
          if not containers:
              print(host + ": no containers listed")
              sys.exit()
          keep = [
              {
                  "name": c["Name"].lstrip("/"),
                  "status": c["State"]["Status"],
                  "started": c["State"]["StartedAt"],
                  "health": c["State"].get("Health"),
              }
              for c in containers
          ]
          with open(out, "w") as f:
              json.dump(keep, f, indent=1)
          bad = [
              "%s (failing streak %s)" % (c["name"], c["health"]["FailingStreak"])
              for c in keep
              if (c["health"] or {}).get("Status") == "unhealthy"
          ]
          print("%s: %d containers, unhealthy: %s" % (host, len(keep), ", ".join(bad) or "none"))
          '
          mkdir -p "{{ container_health_dir }}"
          for h in {{ kolla_hosts | join(' ') }}; do
            {{ manager_ssh }} "ssh -n -o StrictHostKeyChecking=no -o LogLevel=ERROR ${h} 'sudo -n docker ps -aq | xargs -r sudo -n docker inspect'" \
              | python3 -c "${reduce}" "${h}" "{{ container_health_dir }}/${h}.json"
          done
      args:
        executable: /bin/bash
      register: _container_health
      changed_when: false
      failed_when: false

    - name: Show the container health summary
      when: kolla_hosts | length > 0
      ansible.builtin.debug:
        msg: >-
          {{ ((_container_health.stdout_lines | default([]))
              + (_container_health.stderr_lines | default([])))
             | default(['(container health capture produced no output)'], true) }}

    # The validators write their reports on the manager itself, into a
    # directory owned by the operator user, so no sudo is needed.
    - name: Copy the validator reports from the manager
      when: _kolla_manager_address.content is defined
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          mkdir -p "{{ validator_reports_dir }}"
          {{ manager_ssh }} 'test -d /opt/reports/validator && tar -C /opt/reports/validator -czf - .' \
            | tar -xzf - -C "{{ validator_reports_dir }}" 2>/dev/null
          if [ -z "$(ls -A "{{ validator_reports_dir }}")" ]; then
            echo "no validator reports copied"
            rmdir "{{ validator_reports_dir }}"
          else
            chmod -R u+rwX,go+rX "{{ validator_reports_dir }}"
            echo "validator reports: $(find "{{ validator_reports_dir }}" -type f | wc -l) files"
          fi
      args:
        executable: /bin/bash
      register: _validator_reports
      changed_when: false
      failed_when: false

    # Each log is gzipped on the manager and streamed back, stdout and
    # stderr together as "docker logs" interleaves them, with docker's
    # timestamps so the lines can be lined up with the job output.
    - name: Copy the container logs of the manager
      when: _kolla_manager_address.content is defined
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          mkdir -p "{{ manager_containers_dir }}"
          for c in $({{ manager_ssh }} 'sudo -n docker ps -a --format "{{ '{{' }}.Names{{ '}}' }}"'); do
            {{ manager_ssh }} "sudo -n docker logs --timestamps ${c} 2>&1 | gzip" \
              > "{{ manager_containers_dir }}/${c}.log.gz"
          done
          if [ -z "$(ls -A "{{ manager_containers_dir }}")" ]; then
            echo "no manager container logs copied"
            rmdir "{{ manager_containers_dir }}"
          else
            chmod -R u+rwX,go+rX "{{ manager_containers_dir }}"
            echo "manager container logs: $(ls "{{ manager_containers_dir }}" | wc -l) files, $(du -sh "{{ manager_containers_dir }}" | cut -f1) gzipped"
          fi
      args:
        executable: /bin/bash
      register: _manager_containers
      changed_when: false
      failed_when: false

    - name: Copy the kolla logs of all testbed hosts
      when: kolla_hosts | length > 0
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          for h in {{ kolla_hosts | join(' ') }}; do
            mkdir -p "{{ kolla_logs_dir }}/${h}"
            {{ manager_ssh }} "ssh -n -o StrictHostKeyChecking=no -o LogLevel=ERROR ${h} 'sudo -n test -d /var/log/kolla && sudo -n tar --warning=no-file-changed -C /var/log/kolla -czf - .'" \
              | tar -xzf - -C "{{ kolla_logs_dir }}/${h}" 2>/dev/null
            if [ -z "$(ls -A "{{ kolla_logs_dir }}/${h}")" ]; then
              echo "${h}: no /var/log/kolla copied"
              rmdir "{{ kolla_logs_dir }}/${h}"
            fi
          done
          if [ -d "{{ kolla_logs_dir }}" ]; then
            find "{{ kolla_logs_dir }}" -type f ! -name '*.gz' -exec gzip -f {} +
            chmod -R u+rwX,go+rX "{{ kolla_logs_dir }}"
            for d in "{{ kolla_logs_dir }}"/*/; do
              [ -d "${d}" ] || continue
              echo "$(basename "${d}"): $(find "${d}" -type f | wc -l) files, $(du -sh "${d}" | cut -f1) gzipped"
            done
          fi
      args:
        executable: /bin/bash
      register: _kolla_logs
      changed_when: false
      failed_when: false

    - name: Show what was copied
      when: _kolla_hosts.stdout_lines is defined
      ansible.builtin.debug:
        msg: >-
          {{ ((_kolla_hosts.stdout_lines | default([]))
              + (_kolla_hosts.stderr_lines | default([]))
              + (_validator_reports.stdout_lines | default([]))
              + (_validator_reports.stderr_lines | default([]))
              + (_manager_containers.stdout_lines | default([]))
              + (_manager_containers.stderr_lines | default([]))
              + (_kolla_logs.stdout_lines | default([]))
              + (_kolla_logs.stderr_lines | default([])))
             | default(['(kolla log copy was skipped or produced no output)'], true) }}
